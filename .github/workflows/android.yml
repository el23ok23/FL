name: Android

# Compila la app en cada push. Deja el APK de prueba y el bundle (.aab) para Google Play
# como "Artifacts" del workflow (pestaña Actions → la ejecución → Artifacts).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # El runner ubuntu-latest ya trae el SDK de Android (ANDROID_HOME) con las licencias aceptadas.

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del core (precios, zona, teléfonos)
        run: ./gradlew :core:test --no-daemon

      # Firma de release (opcional). Si cargás estos secrets en GitHub, el .aab sale firmado:
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD   (ver docs/GOOGLE_PLAY.md)
      - name: Preparar firma de release
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat > keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: APK de prueba (debug) de las dos ciudades
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Bundles para Google Play (release) de las dos ciudades
        run: ./gradlew :app:bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mi-flete-ciudad-debug-apk
          path: app/build/outputs/apk/caba/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mi-flete-salto-debug-apk
          path: app/build/outputs/apk/salto/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mi-flete-ciudad-release-aab
          path: app/build/outputs/bundle/cabaRelease/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: mi-flete-salto-release-aab
          path: app/build/outputs/bundle/saltoRelease/*.aab

      # Publica los APK de prueba como archivos directos (sin zip) en la sección Releases del repo,
      # siempre con los mismos enlaces:
      #   https://github.com/el23ok23/FL/releases/download/ultima-version/MiFleteCiudad.apk
      #   https://github.com/el23ok23/FL/releases/download/ultima-version/MiFleteSalto.apk
      - name: Preparar archivos para Releases
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/caba/debug/app-caba-debug.apk release/MiFleteCiudad.apk
          cp app/build/outputs/apk/salto/debug/app-salto-debug.apk release/MiFleteSalto.apk
          cp app/build/outputs/bundle/cabaRelease/app-caba-release.aab release/MiFleteCiudad-release.aab
          cp app/build/outputs/bundle/saltoRelease/app-salto-release.aab release/MiFleteSalto-release.aab

      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ultima-version
          name: Última versión de prueba
          body: |
            APK de prueba generados automáticamente desde la rama `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Instalá **MiFleteCiudad.apk** (Ciudad de Buenos Aires) o **MiFleteSalto.apk** (Salto) en el celular.
            Los `.aab` son para Google Play.
          files: |
            release/MiFleteCiudad.apk
            release/MiFleteSalto.apk
            release/MiFleteCiudad-release.aab
            release/MiFleteSalto-release.aab
