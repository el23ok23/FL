name: Android

# Compila la app en cada push. Deja el APK de prueba y el bundle (.aab) para Google Play
# como "Artifacts" del workflow (pestaña Actions → la ejecución → Artifacts).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del core (precios, zona, teléfonos)
        run: ./gradlew :core:test --no-daemon

      # Firma de release (opcional). Si cargás estos secrets en GitHub, el .aab sale firmado:
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD   (ver docs/GOOGLE_PLAY.md)
      - name: Preparar firma de release
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat > keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: APK de prueba (debug)
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Bundle para Google Play (release)
        run: ./gradlew :app:bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mi-flete-ciudad-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mi-flete-ciudad-release-aab
          path: app/build/outputs/bundle/release/*.aab
