name: Android

# Compila la app en cada push. Deja el APK de prueba y el bundle (.aab) para Google Play
# como "Artifacts" del workflow (pestaña Actions → la ejecución → Artifacts).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # El runner ubuntu-latest ya trae el SDK de Android (ANDROID_HOME) con las licencias aceptadas.

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del core (precios, zona, teléfonos)
        run: ./gradlew :core:test --no-daemon

      # Firma de release (opcional). Si cargás estos secrets en GitHub, el .aab sale firmado:
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD   (ver docs/GOOGLE_PLAY.md)
      - name: Preparar firma de release
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat > keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: APK de prueba (debug)
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Bundle para Google Play (release)
        run: ./gradlew :app:bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fletaba-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fletaba-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # Publica el APK de prueba como archivo directo (sin zip) en la sección Releases del repo,
      # siempre con el mismo enlace: https://github.com/el23ok23/FL/releases/download/ultima-version/Fletaba.apk
      - name: Preparar archivos para Releases
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Fletaba.apk
          cp app/build/outputs/bundle/release/app-release.aab release/Fletaba-release.aab

      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ultima-version
          name: Última versión de prueba
          body: |
            APK de prueba generado automáticamente desde la rama `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Instalá **Fletaba.apk** en el celular. El `.aab` es para Google Play.
          files: |
            release/Fletaba.apk
            release/Fletaba-release.aab
